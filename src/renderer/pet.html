<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Pawpal companion</title>
    <link rel="stylesheet" href="pet.css">
    <script type="module" src="pet.js"></script>
</head>
<body>
    <div class="pet-stage" id="pet-stage">
        <div id="speech" class="speech" role="status" hidden></div>
        <pet-avatar id="desktop-puppy" role="button" tabindex="0" aria-label="Companion. Click for head scratches, drag to move, right-click for a menu." title="Click to pet · drag to move · right-click for more"></pet-avatar>
        <div class="pet-caption"><span id="desktop-name">Mochi</span><span class="caption-dot">·</span><span>your little sidekick</span></div>
    </div>
</body>
</html>
